<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0b1220"/><meta name="description" content="Asteria — premium academic operating system"/>
<title>Asteria — Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">A</div><div><strong>Asteria</strong><span>Academic OS</span></div></div>
  <nav class="nav">
    <p class="nav-label">Workspace</p>
    <button class="nav-item active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
    <button class="nav-item" data-page="timetable"><span class="ico">▦</span>Schedule</button>
    <button class="nav-item" data-page="assignments"><span class="ico">✓</span>Assignments</button>
    <button class="nav-item" data-page="homework"><span class="ico">✎</span>Homework</button>
    <button class="nav-item" data-page="calendar"><span class="ico">◫</span>Calendar</button>
    <p class="nav-label">Academics</p>
    <button class="nav-item" data-page="materials"><span class="ico">▤</span>Study Materials</button>
    <button class="nav-item" data-page="exams"><span class="ico">▣</span>Exams & Date Sheet</button>
    <button class="nav-item" data-page="results"><span class="ico">◒</span>Results</button>
    <button class="nav-item" data-page="attendance"><span class="ico">◔</span>Attendance</button>
    <p class="nav-label">Administration</p>
    <button class="nav-item" data-page="fees"><span class="ico">₹</span>Fees</button>
    <button class="nav-item" data-page="announcements"><span class="ico">◉</span>Announcements</button>
    <button class="nav-item" data-page="documents"><span class="ico">▧</span>Documents</button>
  </nav>
  <div class="sidebar-bottom"><button class="nav-item" data-page="notifications"><span class="ico">◌</span>Notifications <b class="badge">4</b></button><button class="nav-item" data-page="settings"><span class="ico">⚙</span>Settings</button><div class="mini-profile"><div class="avatar">DV</div><div><strong>Divyansh Verma</strong><span>D.Pharm · Year 1</span></div><button id="profileBtn">···</button></div></div>
</aside>
<main class="main">
<header class="topbar"><button class="mobile-menu" id="menuBtn">☰</button><div class="crumb" id="crumb">Dashboard</div><button class="search-trigger" id="searchBtn"><span>⌕</span><span>Search anything...</span><kbd>⌘ K</kbd></button><div class="top-actions"><button class="icon-btn" id="themeBtn" title="Toggle theme">☼</button><button class="icon-btn notif" id="notifBtn">◌<i></i></button><div class="top-avatar">DV</div></div></header>
<section class="content" id="content"></section>
</main>
</div>
<div class="mobile-nav"><button class="active" data-page="dashboard">⌂<span>Home</span></button><button data-page="timetable">▦<span>Schedule</span></button><button data-page="assignments">✓<span>Tasks</span></button><button data-page="calendar">◫<span>Calendar</span></button><button id="moreBtn">•••<span>More</span></button></div>
<div class="overlay" id="overlay"></div>
<div class="command" id="command"><div class="command-head"><span>⌕</span><input id="searchInput" placeholder="Search assignments, notes, exams, faculty..." autofocus></div><div class="command-list" id="commandList"></div><div class="command-foot"><span>↑↓ Navigate</span><span>↵ Open</span><span>Esc Close</span></div></div>
<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
</body></html>
